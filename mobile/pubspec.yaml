name: project_saathi_mobile
description: "Project Saathi - Offline-First Mobile Screening Assistant for ASHA Health Workers"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Material & UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Offline Persistence
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # Hardware & Camera
  camera: ^0.11.0+1
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.1
  # Connectivity & Sync
  connectivity_plus: ^6.0.3
  http: ^1.2.1
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/models/
    - assets/images/
