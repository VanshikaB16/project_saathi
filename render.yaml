services:
  # 1. Project Saathi Backend API & Offline Sync Service
  - type: web
    name: project-saathi-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SAATHI_DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock

  # 2. Project Saathi Frontend Dashboard & ASHA Mobile App
  - type: web
    name: project-saathi-web
    runtime: static
    plan: free
    region: oregon
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: project-saathi-api
          property: host
